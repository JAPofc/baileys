name: 💡 Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API / behavior
      render: js
  - type: input
    id: prior
    attributes:
      label: Prior art
      description: Does another Baileys fork / the WhatsApp Business API have this?
