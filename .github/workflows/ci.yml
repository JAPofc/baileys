name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Unit tests (incl. .d.ts parity + VoIP shim against real bundle)
        run: npm test
      - name: Type-check public API under tsc --strict
        run: npm run test:types
      - name: Pack sanity (tarball builds, no stray files)
        run: npm pack --dry-run
